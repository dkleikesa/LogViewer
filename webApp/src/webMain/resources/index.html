<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogViewer</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script>
        // LogViewer 平台桥（供 Kotlin/Wasm 与 Kotlin/JS external 调用）
        window.__lvSave = function (name, content) {
            try {
                var blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url; a.download = name;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
                return true;
            } catch (e) { return false; }
        };
        window.__lvCopy = function (text) {
            try { navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
        };
        window.__lvGetPref = function (key) {
            try { return window.localStorage.getItem('lv_' + key); } catch (e) { return null; }
        };
        window.__lvPutPref = function (key, value) {
            try { window.localStorage.setItem('lv_' + key, value); return true; } catch (e) { return false; }
        };
        // 文件选择：读取为 ArrayBuffer 暂存；回调返回以 \u0001 分隔的文件名（索引即顺序）
        window.__lvFiles = [];
        window.__lvPick = function (cb) {
            var input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.accept = '.log,.txt,.json,.csv,.tsv,text/*,application/*';
            input.style.display = 'none';
            input.onchange = function () {
                var files = Array.from(input.files || []);
                var names = [];
                window.__lvFiles.length = 0;
                if (!files.length) { cb(''); return; }
                Promise.all(files.map(function (f) {
                    return f.arrayBuffer().then(function (buf) {
                        window.__lvFiles.push(buf);
                        names.push(f.name);
                    }).catch(function () { });
                })).then(function () { cb(names.join('\u0001')); });
            };
            document.body.appendChild(input);
            input.click();
            setTimeout(function () {
                if (document.body.contains(input)) document.body.removeChild(input);
            }, 60000);
        };
        window.__lvFileSize = function (idx) {
            return window.__lvFiles[idx] ? window.__lvFiles[idx].byteLength : 0;
        };
        window.__lvReadChunk = function (idx, offset, len) {
            var buf = window.__lvFiles[idx];
            if (!buf) return '';
            var end = Math.min(offset + len, buf.byteLength);
            if (offset >= end) return '';
            var bytes = new Uint8Array(buf, offset, end - offset);
            var s = '';
            for (var i = 0; i < bytes.length; i += 8192) {
                s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, bytes.length)));
            }
            return s;
        };
        window.__lvClearFiles = function () {
            window.__lvFiles.length = 0;
        };
        window.__lvNow = function () { return Date.now(); };
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
